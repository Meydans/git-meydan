    const ROOT_QUESTION = {
      en: {
        question: "What's on your mind? What would you like to think through today?",
        options: ["A decision I'm stuck on", "Something in my personal life", "A work challenge", "A relationship", "A goal or dream", "Just feeling off"],
        insight: "This is your space to think — there's no wrong place to start."
      },
      he: {
        question: "מה מטריד אותך? על מה תרצה/י לחשוב היום?",
        options: ["החלטה שאני תקוע/ה בה", "משהו בחיים האישיים שלי", "אתגר בעבודה", "מערכת יחסים", "מטרה או חלום", "פשוט מרגיש/ה לא בסדר"],
        insight: "זה המרחב שלך לחשוב — אין נקודת התחלה לא נכונה."
      },
    };

    function uid() {
      return `n_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function getPhase(step) {
      return PHASES.find(p => step >= p.minStep && step <= p.maxStep) || PHASES[PHASES.length - 1];
    }

    function createNode({ question, options, insight, depth = 0, parentId = null, answer = null }) {
      const phase = getPhase(depth);
      return {
        id: uid(),
        question,
        options: options || [],
        insight: insight || "",
        answer,
        depth,
        parentId,
        childIds: [],
        color: phase.color,
        createdAt: Date.now(),
      };
    }

    function createSession(name, lang) {
      const root = createNode({ ...ROOT_QUESTION[lang] || ROOT_QUESTION.he, depth: 0, parentId: null });
      const now = Date.now();
      return {
        id: uid(),
        name: name || t(lang, "newSessionDefault", { date: new Date().toLocaleString() }),
        createdAt: now,
        updatedAt: now,
        nodes: { [root.id]: root },
        rootId: root.id,
        currentId: root.id,
        summary: null,
      };
    }

    function loadAllSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveAllSessions(sessions) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }

    function getActiveSessionId() {
      return localStorage.getItem(ACTIVE_KEY) || null;
    }

    function setActiveSessionId(id) {
      if (id) localStorage.setItem(ACTIVE_KEY, id);
      else localStorage.removeItem(ACTIVE_KEY);
    }

    function getNode(session, id) {
      return session?.nodes?.[id] || null;
    }

    function getPathToNode(session, nodeId) {
      const path = [];
      let cur = getNode(session, nodeId);
      while (cur) {
        path.unshift(cur);
        cur = cur.parentId ? getNode(session, cur.parentId) : null;
      }
      return path;
    }

    function getAnsweredPath(session, nodeId) {
      return getPathToNode(session, nodeId).filter(n => n.answer != null);
    }

    function historyFromPath(nodes) {
      return nodes
        .filter(n => n.answer != null)
        .map(n => ({ q: n.question, a: n.answer, color: n.color }));
    }

    function countBranches(session) {
      let branches = 0;
      Object.values(session.nodes).forEach(n => {
        if (n.childIds.length > 1) branches += n.childIds.length - 1;
      });
      return branches;
    }

    function countAnswered(session) {
      return Object.values(session.nodes).filter(n => n.answer != null).length;
    }

    function languageDirective(lang) {
      return lang === "he"
        ? `LANGUAGE: Write the "question", every item in "options", and the "insight" entirely in Hebrew (עברית). Keep the JSON keys themselves in English.`
        : `LANGUAGE: Write the "question", every item in "options", and the "insight" entirely in English.`;
    }

    function buildPrompt(userAnswer, history, nextStep, lang) {
      const historyText = history.map((item, i) => `Step ${i + 1}: Q: "${item.q}" A: "${item.a}"`).join("\n");
      let phaseInstruction = "";
      if (nextStep <= 1) {
        phaseInstruction = `PHASE: Problem Exploration.
Goal: Understand the problem space. Ask a question that clarifies scope, context, or impact. Do NOT ask about causes yet.`;
      } else if (nextStep <= 3) {
        phaseInstruction = `PHASE: Root Cause Analysis.
Goal: Identify the underlying cause, NOT the symptom. Ask "why" type questions. Use 5-Whys style reasoning. Reference what the user already shared to dig one layer deeper.`;
      } else {
        phaseInstruction = `PHASE: Going Deeper.
Goal: Keep the conversation moving forward. Alternate between deepening the understanding of root causes and exploring possible paths forward. Each question should open a new angle — don't repeat or restate what's already been covered. Follow the energy of the conversation; if something important came up, lean into it.`;
      }

      return `You are a thoughtful brainstorming guide helping someone think through a situation — it could be personal, professional, creative, or anything in between. You follow the person's lead on the topic.

${phaseInstruction}

${languageDirective(lang)}

Conversation so far (this branch):
${historyText}

The user just answered: "${userAnswer}"

Your job:
1. Ask ONE focused follow-up question that advances the current phase goal. Reference prior answers to show continuity and make the person feel heard. Do not repeat themes from earlier questions.
2. Provide 6 answer options (2-5 words each) that feel natural and cover a range of realistic responses — mix concrete and emotional where appropriate.
3. Write a 1-2 sentence "insight" that reflects back what you've heard so far and explains why you're asking this next question.

Return ONLY valid JSON, no markdown:
{
  "question": "...",
  "options": ["...", "...", "...", "...", "...", "..."],
  "insight": "..."
}`;
    }

${languageDirective(lang)}

Session transcript:
${historyText}

Return ONLY valid JSON, no markdown:
{
  "problem": "1-2 sentence summary of the core problem",
  "rootCauses": ["Root cause 1", "Root cause 2", "Root cause 3"],
  "solutions": ["Concrete solution 1", "Concrete solution 2", "Concrete solution 3"],
  "nextAction": "The single most important next step"
}`;

    function ApiSettingsModal({ dialogRef, currentKey, onSave, onClear }) {
      const { t: tr } = useLang();
      const [keyInput, setKeyInput] = useState(currentKey);

      const [testStatus, setTestStatus] = useState(null);

      useEffect(() => {
        setKeyInput(currentKey);
        setTestStatus(null);
        setTestError("");
      }, [currentKey]);

      const handleTest = async () => {
        if (!keyInput.trim()) {
          setTestStatus('error');
          setTestError(tr('apiKeyEmpty'));
          return;
        }
        setTestStatus('testing');
        setTestError("");
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${keyInput.trim()}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: "Respond only with the word PONG." }] }]
            })
          });
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            setTestStatus('success');
          } else {
            throw new Error(data?.error?.message || "Invalid API Key or API error.");
          }
        } catch (err) {
          setTestStatus('error');
          setTestError(err.message || "Failed to connect to Gemini API.");
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        onSave(keyInput.trim());
        dialogRef.current?.close();
      };

      const handleClear = () => {
        onClear();
        setKeyInput("");
        setTestStatus(null);
        dialogRef.current?.close();
      };

      useEffect(() => {
        const dialog = dialogRef.current;
        if (!dialog) return;
        const handleBackdropClick = (event) => {
          if (event.target !== dialog) return;
          const rect = dialog.getBoundingClientRect();
          const isDialogContent = (
            rect.top <= event.clientY &&
            event.clientY <= rect.top + rect.height &&
            rect.left <= event.clientX &&
            event.clientX <= rect.left + rect.width
          );
          if (!isDialogContent) dialog.close();
        };
        dialog.addEventListener('click', handleBackdropClick);
        return () => dialog.removeEventListener('click', handleBackdropClick);
      }, [dialogRef]);

        <dialog
          ref={dialogRef}
          closedby="any"
          className="rounded-3xl p-6 sm:p-8 w-full max-w-md bg-white/95 glass border border-slate-200 shadow-2xl backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm select-none"

                  </button>
                </div>
              </div>
            </form>
          </div>
        </dialog>
      );
    }

      const isBranchPoint = node.childIds.length > 1;
      const label = node.answer
        ? node.answer
        : (node.id === session.rootId ? tr('treeStart') : tr('treeOpenQuestion'));
      const shortQ = node.question.length > 48 ? node.question.slice(0, 48) + "…" : node.question;

      return (
        <li className="relative">

            type="button"
            onClick={() => onSelect(node.id)}
            title={`${node.question}${node.answer ? `\n→ ${node.answer}` : ""}`}
            className={`group text-left w-full max-w-xs rounded-2xl border px-3 py-2.5 transition-all duration-200 ${
              isCurrent
                ? `${node.color} dynamic-card tree-node-active border`
                : onActivePath
                  ? `${node.color} dynamic-card border opacity-95 hover:scale-[1.02]`
                  : 'bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50'
            }`}
          >
            <div className="flex items-center gap-2 mb-1">
              <span className={`text-[10px] font-bold uppercase tracking-wider ${isCurrent ? 'dynamic-text' : 'text-slate-400'}`}>
                {node.depth === 0 ? tr('treeRoot') : tr('treeStep', { n: node.depth })}
              </span>
              {isBranchPoint && (
                <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-purple-100 text-purple-700">
                  {tr('treeBranches', { n: node.childIds.length })}
                </span>
              )}
              {isCurrent && (
                <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-slate-800 text-white">{tr('treeHereBadge')}</span>
              )}
            </div>
            <div className={`text-sm font-semibold leading-snug ${isCurrent || onActivePath ? 'text-slate-800' : 'text-slate-600'}`}>
              {label}
            </div>
            {node.answer && (
              <div className="text-[11px] text-slate-400 mt-1 line-clamp-2 group-hover:text-slate-500">
                {tr('treeFrom')}{shortQ}
              </div>
            )}
          </button>

          {node.childIds.length > 0 && (
            <ul className={`mt-3 ml-4 pl-4 border-l-2 space-y-3 ${
              isBranchPoint ? 'border-purple-300' : 'border-slate-200'
            }`}>
              {node.childIds.map((childId) => (
                <TreeNodeView
                  key={childId}
                  session={session}
                  nodeId={childId}
                  currentId={currentId}
                  activePathIds={activePathIds}
                  onSelect={onSelect}
                />
              ))}
            </ul>
          )}
        </li>
      );
    }

    function BranchMap({ session, onSelectNode }) {
      const { t: tr } = useLang();
      const activePathIds = useMemo(() => {
        return new Set(getPathToNode(session, session.currentId).map(n => n.id));
      }, [session]);

      const branchCount = countBranches(session);
      const answered = countAnswered(session);

      return (
        <div className="w-full bg-white/70 glass rounded-3xl border border-slate-200 p-4 sm:p-5 shadow-sm">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h3 className="font-display font-bold text-slate-800 text-sm">{tr('mapTitle')}</h3>
              <p className="text-[11px] text-slate-400 mt-0.5">{tr('mapDesc')}</p>
            </div>
            <div className="flex gap-2 text-[11px] font-semibold">
              <span className="px-2 py-1 rounded-full bg-slate-100 text-slate-600">{tr('mapAnswered', { n: answered })}</span>
              <span className="px-2 py-1 rounded-full bg-purple-50 text-purple-700">{tr('mapForks', { n: branchCount })}</span>
            </div>
          </div>
          <div className="tree-scroll pr-1">
            <ul className="space-y-3">
              <TreeNodeView
                session={session}
                nodeId={session.rootId}
                currentId={session.currentId}
                activePathIds={activePathIds}
                onSelect={onSelectNode}
              />
            </ul>
          </div>
        </div>
      );
    }

    function PathTrail({ session }) {
      const { t: tr, dir } = useLang();
      const path = getPathToNode(session, session.currentId);
      if (path.length === 0) return null;
      return (
        <div className="flex flex-wrap items-center justify-center gap-2 mb-6 w-full animate-fade-in">
          {path.map((item, idx) => (
            <React.Fragment key={item.id}>
              <div className={`px-3 py-1.5 rounded-full text-xs font-semibold ${item.color} dynamic-card border flex items-center gap-2 max-w-[14rem]`}>
                <span className="opacity-50 text-[10px] flex-shrink-0">{idx === 0 ? tr('pathStart') : tr('pathStep', { n: idx })}</span>
                <span className="truncate">{item.answer || '…'}</span>
              </div>
              {idx < path.length - 1 && (
                <svg className="w-3 h-3 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d={dir === 'rtl' ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"}/>
                </svg>
              )}
            </React.Fragment>
          ))}
        </div>
      );
    }

    function SessionsSidebar({
      sessions,
      activeId,
      onNew,
      onSelect,
      onRename,
      onDelete,
      onExport,
      onImport,
      collapsed,
      onToggle,
    }) {
      const { t: tr, dir } = useLang();
      const list = Object.values(sessions).sort((a, b) => b.updatedAt - a.updatedAt);
      const fileRef = useRef(null);

      return (
        <aside className={`w-full lg:w-72 flex-shrink-0 ${collapsed ? 'lg:w-12' : ''}`}>
          <div className="bg-white/80 glass rounded-3xl border border-slate-200 shadow-sm p-4 sticky top-4">
            <div className="flex items-center justify-between gap-2 mb-3">
              {!collapsed && <h3 className="font-display font-bold text-slate-800 text-sm">{tr('sessionsTitle')}</h3>}
              <div className="flex items-center gap-1 ml-auto">
                <button
                  type="button"
                  onClick={onNew}
                  title={tr('newSessionTitle')}
                  className="p-2 rounded-full hover:bg-slate-100 text-slate-600 transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                {!collapsed && (
                  <>
                    <button type="button" onClick={onExport} title={tr('exportTitle')} className="p-2 rounded-full hover:bg-slate-100 text-slate-600 transition-colors">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                    <button type="button" onClick={() => fileRef.current?.click()} title={tr('importTitle')} className="p-2 rounded-full hover:bg-slate-100 text-slate-600 transition-colors">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </button>
                    <input
                      ref={fileRef}
                      type="file"
                      accept="application/json,.json"
                      className="hidden"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) onImport(file);
                        e.target.value = "";
                      }}
                    />
                  </>
                )}
                <button
                  type="button"
                  onClick={onToggle}
                  title={collapsed ? tr('expandTitle') : tr('collapseTitle')}
                  className="hidden lg:inline-flex p-2 rounded-full hover:bg-slate-100 text-slate-500 transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    {(dir === 'rtl' ? !collapsed : collapsed)
                      ? <path d="M9 18l6-6-6-6"/>
                      : <path d="M15 18l-6-6 6-6"/>}
                  </svg>
                </button>
              </div>
            </div>

            {!collapsed && (
              <div className="sidebar-scroll flex flex-col gap-2 pr-1">
                {list.length === 0 && (
                  <p className="text-xs text-slate-400 py-4 text-center">{tr('noSessions')}</p>
                )}
                {list.map((s) => {
                  const active = s.id === activeId;
                  const answered = countAnswered(s);
                  const forks = countBranches(s);
                  return (
                    <div
                      key={s.id}
                      className={`rounded-2xl border p-3 transition-all ${
                        active ? 'border-purple-300 bg-purple-50/60 shadow-sm' : 'border-slate-100 bg-white hover:border-slate-200'
                      }`}
                    >
                      <button type="button" onClick={() => onSelect(s.id)} className="w-full text-left">
                        <div className="font-semibold text-sm text-slate-800 truncate">{s.name}</div>
                        <div className="flex flex-wrap gap-1.5 mt-1.5 text-[10px] font-semibold text-slate-400">
                          <span>{tr('sessionSteps', { n: answered })}</span>
                          {forks > 0 && <span className="text-purple-600">{tr('sessionForks', { n: forks })}</span>}
                          <span>{new Date(s.updatedAt).toLocaleDateString()}</span>
                        </div>
                      </button>
                      {active && (
                        <div className="flex gap-1 mt-2 pt-2 border-t border-purple-100">
                          <button
                            type="button"
                            onClick={() => {
                              const name = prompt(tr('renamePrompt'), s.name);
                              if (name && name.trim()) onRename(s.id, name.trim());
                            }}
                            className="flex-1 text-[11px] font-semibold py-1.5 rounded-lg hover:bg-white text-slate-600"
                          >
                            {tr('rename')}
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              if (confirm(tr('deleteConfirm'))) onDelete(s.id);
                            }}
                            className="flex-1 text-[11px] font-semibold py-1.5 rounded-lg hover:bg-rose-50 text-rose-600"
                          >
                            {tr('deleteBtn')}
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </aside>
      );
    }

    function bootstrapSessions(lang) {
      const all = loadAllSessions();
      const activeId = getActiveSessionId();
      if (activeId && all[activeId]) {
        return { sessions: all, session: all[activeId] };
      }
      const first = Object.values(all).sort((a, b) => b.updatedAt - a.updatedAt)[0];
      if (first) {
        setActiveSessionId(first.id);
        return { sessions: all, session: first };
      }
      const fresh = createSession(t(lang, "firstSessionName"), lang);
      const next = { ...all, [fresh.id]: fresh };
      saveAllSessions(next);
      setActiveSessionId(fresh.id);
      return { sessions: next, session: fresh };
    }

    function App() {
      const [lang, setLang] = useState(getStoredLang);
      const dir = lang === "he" ? "rtl" : "ltr";
      const tr = useCallback((key, vars) => t(lang, key, vars), [lang]);

      const [boot] = useState(() => bootstrapSessions(lang));
      const [sessions, setSessions] = useState(() => boot.sessions);
      const [session, setSession] = useState(() => boot.session);

      const [isLoading, setIsLoading] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);
      const [customAnswer, setCustomAnswer] = useState("");
      const [sessionError, setSessionError] = useState(null);
      const [showSummary, setShowSummary] = useState(false);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [mapOpen, setMapOpen] = useState(true);

      const [apiKey, setApiKey] = useState(() => localStorage.getItem(API_KEY_STORAGE) || "");
      const [aiStatus, setAiStatus] = useState("checking");
      const dialogRef = useRef(null);

      useEffect(() => {
        localStorage.setItem(LANG_KEY, lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = dir;
        document.title = tr('appName');
        const topbarBack = document.getElementById('topbarBackText');
        if (topbarBack) topbarBack.textContent = tr('back');
        const topbarApp = document.getElementById('topbarAppName');
        if (topbarApp) topbarApp.textContent = tr('appName');
        const headerBack = document.getElementById('headerBackText');
        if (headerBack) headerBack.textContent = tr('backAll');
        const headerApp = document.getElementById('headerAppName');
        if (headerApp) headerApp.textContent = tr('appName');
      }, [lang, dir, tr]);

      const currentNode = getNode(session, session.currentId) || getNode(session, session.rootId);
      const currentStep = currentNode?.depth || 0;
      const phase = getPhase(currentStep);
      const themeClass = phase.color;
      const answeredOnPath = getAnsweredPath(session, session.currentId);
      const siblingBranches = useMemo(() => {
        if (!currentNode?.parentId) return [];
        const parent = getNode(session, currentNode.parentId);
        if (!parent) return [];
        return parent.childIds
          .filter(id => id !== currentNode.id)
          .map(id => getNode(session, id))
          .filter(Boolean);
      }, [session, currentNode]);

      const persistSession = useCallback((nextSession) => {
        const updated = { ...nextSession, updatedAt: Date.now() };
        setSession(updated);
        setSessions(prev => {
          const next = { ...prev, [updated.id]: updated };
          saveAllSessions(next);
          return next;
        });
        setActiveSessionId(updated.id);
      }, []);

      useEffect(() => {
        if (apiKey) {
          setAiStatus("active-direct");
        } else {
          setAiStatus("checking");
          fetch("/api/gemini", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: "" })
          })
            .then(res => {
              if (res.status === 400) setAiStatus("active-proxy");
              else setAiStatus("offline");
            })
            .catch(() => setAiStatus("offline"));
        }
      }, [apiKey]);

      const callGemini = async (prompt, model = "gemini-3.5-flash") => {
        if (apiKey) {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.2 }
            })
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData?.error?.message || `API request failed with status ${res.status}`);
          }
          return res.json();
        }
        const res = await fetch("/api/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, model })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `Proxy request failed with status ${res.status}`);
        }
        return res.json();
      };

      const parseAiJson = (rawData) => {
        const text = rawData.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("Invalid response format from AI.");
        return JSON.parse(jsonMatch[0]);
      };

      const handleChoice = async (opt) => {
        if (isLoading || !currentNode) return;
        setIsLoading(true);
        setSelectedOption(opt);
        setSessionError(null);
        setShowSummary(false);

        try {
          // Mark answer on current node
          const answeredNode = { ...currentNode, answer: opt };
          let nodes = { ...session.nodes, [answeredNode.id]: answeredNode };

          // Reuse existing child if this answer already created a branch
          const matchingChild = answeredNode.childIds
            .map(id => nodes[id])
            .find(c => c && c.parentAnswer === opt);

          if (matchingChild) {
            persistSession({
              ...session,
              nodes,
              currentId: matchingChild.id,
              summary: null,
            });
            return;
          }

          const pathHistory = historyFromPath(getPathToNode({ ...session, nodes }, answeredNode.id));
          const nextDepth = answeredNode.depth + 1;
          const fallbackQuestions = FALLBACK_QUESTIONS[lang] || FALLBACK_QUESTIONS.he;
          let nextQ = fallbackQuestions[Math.min(nextDepth, fallbackQuestions.length - 1)];

          try {
            if (!apiKey && aiStatus !== "active-proxy") {
              throw new Error("AI is configured offline.");
            }
            const prompt = buildPrompt(opt, pathHistory, nextDepth, lang);
            const rawData = await callGemini(prompt, "gemini-3.5-flash");
            const parsed = parseAiJson(rawData);
            nextQ = {
              question: parsed.question,
              options: parsed.options || [],
              insight: parsed.insight,
            };
          } catch (err) {
            console.error("AI error:", err);
            if (err.message !== "AI is configured offline.") {
              setSessionError(err.message || "Failed to contact Gemini");
            }
          }

          const child = createNode({
            question: nextQ.question,
            options: nextQ.options,
            insight: nextQ.insight,
            depth: nextDepth,
            parentId: answeredNode.id,
          });
          child.parentAnswer = opt;

          const parentWithChild = {
            ...answeredNode,
            childIds: [...answeredNode.childIds, child.id],
          };
          nodes = {
            ...nodes,
            [parentWithChild.id]: parentWithChild,
            [child.id]: child,
          };

          persistSession({
            ...session,
            nodes,
            currentId: child.id,
            summary: null,
          });
        } finally {
          setIsLoading(false);
          setSelectedOption(null);
          setCustomAnswer("");
        }
      };

      const handleCustomSubmit = (e) => {
        e.preventDefault();
        const trimmed = customAnswer.trim();
        if (trimmed && !isLoading) handleChoice(trimmed);
      };

      const handleSelectNode = (nodeId) => {
        if (isLoading) return;
        setShowSummary(false);
        setSessionError(null);
        setSelectedOption(null);
        setCustomAnswer("");
        persistSession({ ...session, currentId: nodeId });
      };

      const handleSummarize = async () => {
        if (isLoading) return;
        setIsLoading(true);
        setSessionError(null);
        try {
          if (!apiKey && aiStatus !== "active-proxy") {
            throw new Error("AI is configured offline.");
          }
          const history = historyFromPath(getPathToNode(session, session.currentId));
          const prompt = buildSummaryPrompt(history, lang);
          const rawData = await callGemini(prompt, "gemini-3.5-flash");
          const parsed = parseAiJson(rawData);
          const next = { ...session, summary: parsed };
          persistSession(next);
          setShowSummary(true);
        } catch (err) {
          console.error("AI error:", err);
          if (err.message !== "AI is configured offline.") {
            setSessionError(err.message || "Failed to contact Gemini");
          }
          const fallback = lang === "he" ? {
            problem: "בהתבסס על מה ששיתפת, את/ה מתמודד/ת עם משהו שמעיק עלייך ומצריך יותר בהירות.",
            rootCauses: ["צורך שלא סופק או ציפייה שלא נאמרה", "דפוס חוזר שממשיך לצוץ", "מתח בין מה שאת/ה רוצה לבין המצב הנוכחי"],
            solutions: ["ציין/י את הדבר האחד שהכי חסר לך כרגע ובקש/י אותו", "עשה/י צעד קטן וקונקרטי השבוע לקראת השינוי שאת/ה רוצה", "קיים/י שיחה כנה — עם עצמך או עם מישהו אחר — על מה שבאמת קורה"],
            nextAction: "בחר/י את התובנה שהכי נגעה בך ועשה/י איתה משהו ב-24 השעות הקרובות."
          } : {
            problem: "Based on what you've shared, you're navigating something that's been weighing on you and deserves more clarity.",
            rootCauses: ["An unmet need or unspoken expectation", "A recurring pattern that keeps showing up", "Tension between what you want and your current situation"],
            solutions: ["Name the one thing you most need right now and ask for it", "Take one small concrete step this week toward the change you want", "Have an honest conversation — with yourself or someone else — about what's really going on"],
            nextAction: "Pick the insight that resonated most and do one thing about it in the next 24 hours."
          };
          persistSession({ ...session, summary: fallback });
          setShowSummary(true);
        } finally {
          setIsLoading(false);
        }
      };

      const handleNewSession = () => {
        const defaultName = tr("newSessionDefault", { date: new Date().toLocaleString() });
        const name = prompt(tr("newSessionPrompt"), defaultName);
        if (name === null) return;
        const fresh = createSession(name.trim() || defaultName, lang);
        setSessions(prev => {
          const next = { ...prev, [fresh.id]: fresh };
          saveAllSessions(next);
          return next;
        });
        setSession(fresh);
        setActiveSessionId(fresh.id);
        setShowSummary(false);
        setSessionError(null);
        setCustomAnswer("");
      };

      const handleSelectSession = (id) => {
        const s = sessions[id];
        if (!s) return;
        setSession(s);
        setActiveSessionId(id);
        setShowSummary(!!s.summary);
        setSessionError(null);
        setCustomAnswer("");
      };

      const handleRename = (id, name) => {
        setSessions(prev => {
          const s = prev[id];
          if (!s) return prev;
          const updated = { ...s, name, updatedAt: Date.now() };
          const next = { ...prev, [id]: updated };
          saveAllSessions(next);
          if (session.id === id) setSession(updated);
          return next;
        });
      };

      const handleDelete = (id) => {
        setSessions(prev => {
          const next = { ...prev };
          delete next[id];
          saveAllSessions(next);
          if (session.id === id) {
            const remaining = Object.values(next).sort((a, b) => b.updatedAt - a.updatedAt);
            if (remaining[0]) {
              setSession(remaining[0]);
              setActiveSessionId(remaining[0].id);
            } else {
              const fresh = createSession(tr("firstSessionName"), lang);
              next[fresh.id] = fresh;
              saveAllSessions(next);
              setSession(fresh);
              setActiveSessionId(fresh.id);
            }
            setShowSummary(false);
          }
          return next;
        });
      };

      const handleExport = () => {
        const blob = new Blob([JSON.stringify(session, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${(session.name || "session").replace(/[^\w\-]+/g, "_")}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImport = async (file) => {
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!data || !data.nodes || !data.rootId || !data.currentId) {
            alert(tr("importInvalid"));
            return;
          }
          const imported = {
            ...data,
            id: uid(),
            name: data.name ? tr("importedSuffix", { name: data.name }) : tr("importedDefault", { date: new Date().toLocaleString() }),
            createdAt: data.createdAt || Date.now(),
            updatedAt: Date.now(),
          };
          setSessions(prev => {
            const next = { ...prev, [imported.id]: imported };
            saveAllSessions(next);
            return next;
          });
          setSession(imported);
          setActiveSessionId(imported.id);
          setShowSummary(!!imported.summary);
        } catch {
          alert(tr("importFailed"));
        }
      };

      const handleReset = () => {
        if (!confirm(tr("resetConfirm"))) return;
        handleNewSession();
      };

      // Existing children of current node (already explored answers from here)
      const exploredFromHere = (currentNode?.childIds || [])
        .map(id => getNode(session, id))
        .filter(Boolean);

      return (
        <LangContext.Provider value={{ lang, t: tr, dir }}>
        <div className={`w-full max-w-7xl mx-auto flex flex-col lg:flex-row gap-6 items-start h-full transition-colors duration-700 ${themeClass}`}>
          <div className="absolute top-1/4 right-1/4 -z-10 w-[400px] h-[400px] blur-[150px] rounded-full dynamic-bg opacity-20 pointer-events-none transition-colors duration-1000"></div>

          <SessionsSidebar
            sessions={sessions}
            activeId={session.id}
            onNew={handleNewSession}
            onSelect={handleSelectSession}
            onRename={handleRename}
            onDelete={handleDelete}
            onExport={handleExport}
            onImport={handleImport}
            collapsed={sidebarCollapsed}
            onToggle={() => setSidebarCollapsed(c => !c)}
          />

          <div className="flex-1 w-full flex flex-col items-center min-w-0">
            <header className="mb-4 w-full text-center flex flex-col items-center gap-3">
              <div>
                <h2 className="font-display text-3xl sm:text-4xl font-bold text-slate-800 mb-1">{tr('heading')}</h2>
                <p className="text-slate-500 text-sm sm:text-base">{tr('subheading')}</p>
                <p className="text-xs text-slate-400 mt-1 font-medium">{session.name} · {tr('autoSaved')}</p>
              </div>
              <div className="flex flex-wrap items-center justify-center gap-2">
                <AiStatusBadge status={aiStatus} onClick={() => dialogRef.current?.showModal()} />
                <button
                  type="button"
                  onClick={() => setMapOpen(o => !o)}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 shadow-sm"
                >
                  {mapOpen ? tr('hideMap') : tr('showMap')}
                </button>
                <button
                  type="button"
                  onClick={() => setLang(l => (l === "he" ? "en" : "he"))}
                  title={tr('langToggle')}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 shadow-sm"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                  {tr('langToggle')}
                </button>
              </div>
            </header>

            <PhaseBar currentStep={currentStep} />

            {mapOpen && (
              <div className="w-full max-w-3xl mb-6 animate-fade-in">
                <BranchMap session={session} onSelectNode={handleSelectNode} />
              </div>
            )}

            {showSummary && session.summary ? (
              <SummaryPanel
                summary={session.summary}
                onReset={handleReset}
                onBackToMap={() => setShowSummary(false)}
              />
            ) : (
              <>
                <PathTrail session={session} />

                {siblingBranches.length > 0 && (
                  <div className="w-full max-w-2xl mb-4 flex flex-wrap items-center justify-center gap-2 animate-fade-in">
                    <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">{tr('siblingBranches')}</span>
                    {siblingBranches.map(b => (
                      <button
                        key={b.id}
                        type="button"
                        onClick={() => handleSelectNode(b.id)}
                        className="px-3 py-1 rounded-full text-xs font-semibold border border-purple-200 bg-purple-50 text-purple-700 hover:bg-purple-100 transition-colors"
                      >
                        {b.parentAnswer || b.answer || tr('branchFallback')}
                      </button>
                    ))}
                  </div>
                )}

                <div className="w-full max-w-2xl bg-white/80 glass rounded-3xl p-8 sm:p-12 mb-6 text-center shadow-xl animate-fade-in border-t-4 dynamic-card">
                  {aiStatus === 'offline' && !apiKey && (
                    <div className="mb-6 -mt-4 py-2 px-4 rounded-xl bg-amber-50 border border-amber-100 text-amber-700 text-xs font-semibold inline-flex items-center gap-1.5 mx-auto">
                      <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                      {tr('offlineBanner')}
                    </div>
                  )}
                  {sessionError && (
                    <div className="mb-6 -mt-4 py-2 px-4 rounded-xl bg-rose-50 border border-rose-100 text-rose-700 text-xs font-semibold inline-flex items-center gap-1.5 mx-auto">
                      {tr('aiErrorBanner', { error: sessionError })}
                    </div>
                  )}

                  {exploredFromHere.length > 0 && (
                    <div className="mb-6 p-3 rounded-2xl bg-purple-50/80 border border-purple-100 text-left">
                      <p className="text-[11px] font-semibold uppercase tracking-wider text-purple-600 mb-2">
                        {tr('exploredFromHere', { n: exploredFromHere.length })}
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {exploredFromHere.map(child => (
                          <button
                            key={child.id}
                            type="button"
                            onClick={() => handleSelectNode(child.id)}
                            className={`px-3 py-1.5 rounded-full text-xs font-semibold border transition-all ${
                              child.id === session.currentId
                                ? 'bg-purple-600 text-white border-purple-600'
                                : 'bg-white text-purple-700 border-purple-200 hover:bg-purple-100'
                            }`}
                          >
                            {tr('exploreOption', { label: child.parentAnswer || tr('exploreFallback') })}
                          </button>
                        ))}
                      </div>
                      <p className="text-[11px] text-purple-500 mt-2">{tr('pickDifferent')}</p>
                    </div>
                  )}

                  <h3 className="font-display text-2xl sm:text-3xl font-medium leading-relaxed mb-8 text-slate-800">
                    {currentNode?.question}
                  </h3>

                  {isLoading ? (
                    <div className="h-48 flex items-center justify-center">
                      <LoadingDots />
                    </div>
                  ) : (
                    <div className="flex flex-col gap-6">
                      <div className="flex flex-wrap justify-center gap-3">
                        {(currentNode?.options || []).map((opt, i) => {
                          const alreadyExplored = exploredFromHere.some(c => c.parentAnswer === opt);
                          return (
                            <button
                              key={i}
                              onClick={() => handleChoice(opt)}
                              disabled={isLoading}
                              className={`px-6 py-3 rounded-full border text-sm font-medium hover:-translate-y-1 transition-all duration-300 dynamic-hover shadow-sm ${
                                alreadyExplored
                                  ? 'border-purple-300 bg-purple-50 text-purple-800'
                                  : 'border-slate-200 bg-white text-slate-700'
                              } ${selectedOption === opt ? 'dynamic-bg text-white scale-105' : selectedOption ? 'animate-shrink-out' : ''}`}
                            >
                              {opt}{alreadyExplored ? ' ↩' : ''}
                            </button>
                          );
                        })}
                      </div>

                      <div className="relative mt-2 w-full max-w-sm mx-auto">
                        <div className="absolute inset-0 flex items-center" aria-hidden="true">
                          <div className="w-full border-t border-slate-200"></div>
                        </div>
                        <div className="relative flex justify-center">
                          <span className="px-3 bg-white text-xs text-slate-400 uppercase font-semibold rounded-full">{tr('orTypeOwn')}</span>
                        </div>
                      </div>

                      <form onSubmit={handleCustomSubmit} className={`w-full max-w-sm mx-auto flex gap-2 ${selectedOption ? 'animate-shrink-out' : ''}`}>
                        <input
                          type="text"
                          value={customAnswer}
                          onChange={e => setCustomAnswer(e.target.value)}
                          placeholder={tr('customPlaceholder')}
                          className="flex-1 bg-white border border-slate-200 shadow-inner rounded-full px-5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-opacity-50 transition-all dynamic-ring text-slate-800"
                          style={{ '--tw-ring-color': 'var(--theme-color)' }}
                        />
                        <button type="submit" disabled={!customAnswer.trim() || isLoading} className="p-2.5 rounded-full bg-slate-800 hover:bg-slate-700 transition-all text-white disabled:opacity-50 shadow-md">
                          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                      </form>
                    </div>
                  )}
                </div>

                <div className="w-full max-w-2xl px-6 py-5 rounded-2xl bg-white/60 border border-slate-200 shadow-sm text-center animate-fade-in backdrop-blur-md mb-6">
                  <p className="text-slate-600 font-medium text-sm leading-relaxed italic">
                    💡 {currentNode?.insight}
                  </p>
                </div>

                {answeredOnPath.length >= MIN_STEPS_FOR_SUMMARY && !isLoading && (
                  <button
                    onClick={handleSummarize}
                    className="mb-10 group flex items-center gap-3 px-7 py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm shadow-lg transition-all duration-300 hover:-translate-y-1 animate-fade-in"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="opacity-70 group-hover:opacity-100 transition-opacity"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                    {tr('summarizeBtn')}
                  </button>
                )}
              </>
            )}

            <ApiSettingsModal
              dialogRef={dialogRef}
              currentKey={apiKey}
              onSave={(newKey) => {
                localStorage.setItem(API_KEY_STORAGE, newKey);
                setApiKey(newKey);
              }}
              onClear={() => {
                localStorage.removeItem(API_KEY_STORAGE);
                setApiKey("");
              }}
            />
          </div>
        </div>
        </LangContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
